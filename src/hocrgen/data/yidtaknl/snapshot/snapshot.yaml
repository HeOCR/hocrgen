dataset_license: CC-BY-4.0
dataset_license_evidence: figshare API license field "CC BY 4.0" (https://creativecommons.org/licenses/by/4.0/), checked 2026-11-06
bundle_url: https://surfdrive.surf.nl/files/index.php/s/mov7H4wDaog4zkF
bundle_format: >-
  Link-only SURFdrive share with one folder per printed work. Each folder holds page JPEGs
  (NNNN_pNNN.jpg) and a txt/ folder of page-level Transkribus plain-text exports with the same stem.
  No PAGE XML, no line or word geometry, and no checksum manifest (the WebDAV server reports per-file checksums).
captured_at: 2026-11-06
entries_path: entries.jsonl
matched_pages_path: matched_pages.jsonl
upstream_checksums: >-
  The share reports SHA-1, MD5 and Adler-32 per file over WebDAV (oc:checksums); vendored entries also pin
  the sha256 of the bytes captured on 2026-11-06.
scope: fixture
notes: >-
  F8d/F8d2 fixture. Five vendored entries: pages 7 and 8 of the 1781 work, page 7 of the 1747 work, and page
  10 of NLI volume JB 899, all NLI scans whose manifest licence slug is public-domain-free-use; plus one
  metadata-only HUC entry (RBR O 128) that proves the scan-rights rejection. Vendored JPEGs are downscaled
  thumbnails; text files are the upstream bytes unchanged, pinned by sha256. matched_pages.jsonl lists every
  page of the 1747 and JB 899 works matched to its NLI canvas, pinned by the share's own SHA-1 and byte
  count; those pages are not vendored and are never candidates. The 1737 and 1772 folders matched no public
  NLI canvas and are not admitted; the HUC works are excluded. Scan rights come from the pinned NLI manifest
  captures in iiif/ (hocrgen.nli_iiif_manifest_capture.v1), decided by the F8c licence-slug gate.
