    ... ועם פי' אדומו"ר הגאון ... מו"ה אליהו [בן שלמה זלמן] מווילנא ... והוספת כמה
    דינים והנהגות טובות מאדומ"ור הגאון ז"ל ... הובא לבית הדפוס על ידי ... מרדכי צבי
