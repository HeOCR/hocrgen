version: 1
dataset: Reshumot born-digital gazette (ספר החוקים, קובץ התקנות)
operator: Ministry of Justice, Reshumot unit (gov.il)
landing_url: https://www.gov.il/he/departments/official_gazette
collector_url: https://www.gov.il/he/Departments/DynamicCollectors/gazette-official
api_search_url: https://pub-justice.openapi.gov.il/pub/moj/portal/rest/searchpredefinedapi/v1/SearchPredefinedApi/Reshumot/Search
api_access_note: Undocumented JSON search API behind the gov.il gazette collector,
  called with the public x-client-id embedded in that page. Automated access allowed
  by the maintainer (F8 decision 4). Document URLs are opaque tokens, so booklet number,
  series and date are the stable keys.
rights_basis: 'Copyright Act 2007 section 6: no copyright in laws and regulations.
  Admitted series: ספר החוקים (FolderType 1) and קובץ התקנות (FolderType 3). ילקוט
  הפרסומים, bills and other series are not section-6 material and are never admitted.'
born_digital_from: '2006-01-01'
born_digital_note: Samples from 2006 (booklet 2061) on are Adobe InDesign PDFs; samples
  up to 2005 are bitonal scans with an OCR layer (verification note, Source 3). The
  exact switch booklet is unverified, so the gate also requires per-PDF born-digital
  evidence.
captured_at: '2026-11-06'
capture: One-off F8e operator capture, 4 requests to gov.il (2 searches, 2 PDFs),
  6 s apart, with the User-Agent "HeOCR-hocrgen-fixture-capture/0.1 (+https://github.com/HeOCR/hocrgen;
  one-off operator capture, throttled)". Raw PDFs are not committed; each entry pins
  the PDF sha256. F8e3 re-extracted the same pinned PDFs offline.
entries_path: entries.jsonl
scope: fixture
notes: 'Three-entry fixture, migrated to the glyph-layer method in F8e3 (pdf_glyph_geometry_logical.v1;
  F8e''s pdftotext method is retired). sefer_hachukim_2580__p0002: Page 2 of ספר החוקים
  2580 (16.8.2016) is admitted whole. sefer_hachukim_2580__p0004: Page 4 is admitted
  whole; it holds letter-spaced signature names. sefer_hachukim_2580__p0008: Page
  8, the colophon, has no running footer to anchor the booklet number and date, so
  it is rejected (missing_expected_phrase); it is kept only to prove the rejection.
  Each entry carries its glyph layer (extraction/*.glyphs.json.gz), its pdftoppm 150
  dpi gray render (rendering.is_scan false) and the rebuilt text, and pins the outline
  identity table (glyph_outlines.json); the gate re-derives the text and checks it
  against the render. Each line''s text is verified, not the order of lines and blocks
  across the page (text.reading_order_verified: within_line).'
