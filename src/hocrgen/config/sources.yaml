version: 1
sources:
  - id: nli_any_use_permitted
    name: National Library of Israel - Any Use Permitted items
    fetcher: nli
    status: allowed
    default_public_release: true
    allowed_content_types:
      - handwritten_modern
      - printed_modern
      - printed_historical
      - manuscript_scan
    rights_strategy:
      type: exact_match
      values:
        # F8c: keyed on the IIIF manifest licence slug; only public-domain-free-use maps to open.
        - https://www.nli.org.il/contenteditors/pages-for-terms-of-use/public-domain-free-use
        # Legacy item-page display string for seeds without a manifest capture.
        - Any Use Permitted
    normalized_license: PD-IL
    rights_classification: open
    requires_manual_review: false
    source_operations:
      operational_status: active
      health_expectations:
        min_candidates: 1
        min_assets: 1
    settings:
      seed_manifest: package://data/nli/seeds.yaml
  - id: pinkas_open
    name: Pinkas historical open package
    fetcher: pinkas
    status: allowed
    default_public_release: true
    allowed_content_types:
      - handwritten_historical
    rights_strategy:
      type: exact_match
      values:
        - PD-IL
    normalized_license: PD-IL
    rights_classification: open
    requires_manual_review: false
    source_operations:
      operational_status: active
      health_expectations:
        min_candidates: 1
        min_assets: 1
    settings:
      records_path: package://data/pinkas/records.json
      extra:
        source_depth_expansion_manifest: package://data/pinkas/source_depth_expansion.yaml
  - id: biblia_open
    name: BiblIA packaged open subset
    fetcher: biblia
    status: allowed
    default_public_release: true
    allowed_content_types:
      - handwritten_historical
      - printed_historical
    rights_strategy:
      type: exact_match
      values:
        - PD-IL
    normalized_license: PD-IL
    rights_classification: open
    requires_manual_review: false
    source_operations:
      operational_status: active
      health_expectations:
        min_candidates: 1
        min_assets: 1
    settings:
      records_path: package://data/biblia/records.json
      extra:
        source_depth_expansion_manifest: package://data/biblia/source_depth_expansion.yaml
  - id: hash_nli_any_use
    name: HASH (HeOCR/hash) NLI Any Use Permitted handwritten scans
    fetcher: hash
    status: review_only
    default_public_release: false
    allowed_content_types:
      - handwritten_historical
    rights_strategy:
      type: exact_match
      values:
        - LicenseRef-Public-Domain-Israel
    normalized_license: PD-IL
    rights_classification: open
    requires_manual_review: false
    source_operations:
      operational_status: active
      health_expectations:
        min_candidates: 1
        min_assets: 1
    settings:
      extra:
        hash_snapshot_root: package://data/hash/snapshot
  - id: hash_public_domain
    name: HASH (HeOCR/hash) public-domain-marked handwritten scans
    fetcher: hash
    status: review_only
    default_public_release: false
    allowed_content_types:
      - handwritten_historical
    rights_strategy:
      type: exact_match
      values:
        - PDM-1.0
        - LicenseRef-Public-Domain-Ukraine
    normalized_license: PDM-1.0
    rights_classification: open
    requires_manual_review: false
    source_operations:
      operational_status: active
      health_expectations:
        min_candidates: 1
        min_assets: 1
    settings:
      extra:
        hash_snapshot_root: package://data/hash/snapshot
  - id: yidtaknl_vaybertaytsh_gt
    name: YidTakNL Vaybertaytsh printed-Yiddish ground truth (figshare 25422844), NLI-scanned pages
    fetcher: yidtaknl
    status: review_only
    default_public_release: false
    allowed_content_types:
      - printed_historical
    rights_strategy:
      type: exact_match
      values:
        - CC-BY-4.0
    normalized_license: CC-BY-4.0
    rights_classification: open_with_attribution
    requires_manual_review: false
    source_operations:
      operational_status: active
      health_expectations:
        min_candidates: 1
        min_assets: 1
    settings:
      extra:
        yidtaknl_snapshot_root: package://data/yidtaknl/snapshot
  - id: wikisource_he_proofread
    name: Hebrew Wikisource proofread pages (ProofreadPage) with Commons page scans
    fetcher: wikisource_proofread
    status: review_only
    default_public_release: false
    allowed_content_types:
      - printed_historical
    rights_strategy:
      type: exact_match
      values:
        - CC-BY-SA-4.0
    normalized_license: CC-BY-SA-4.0
    rights_classification: sharealike
    requires_manual_review: true
    source_operations:
      operational_status: active
      health_expectations:
        min_candidates: 1
        min_assets: 1
    settings:
      extra:
        wikisource_snapshot_root: package://data/wikisource/snapshot
  - id: project_synthetic
    name: hocrsyngen manifest-backed synthetic source
    fetcher: hocrsyngen_manifest
    status: allowed
    default_public_release: true
    allowed_content_types:
      - synthetic_printed_hebrew
      - synthetic_handwritten_like_hebrew
    rights_strategy:
      type: exact_match
      values:
        - PROJECT-SYNTHETIC
    normalized_license: PROJECT-SYNTHETIC
    rights_classification: open
    requires_manual_review: false
    source_operations:
      operational_status: active
      health_expectations:
        min_candidates: 1
        min_assets: 1
    settings:
      hocrsyngen_batch_path: package://data/hocrsyngen/contracts/generation_manifest_v1/fixture-batch
